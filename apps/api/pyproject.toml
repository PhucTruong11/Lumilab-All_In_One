[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumilab-api"
version = "0.1.0"
description = "LumiLab B API shell"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.136,<0.137", "uvicorn>=0.52,<0.53"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
