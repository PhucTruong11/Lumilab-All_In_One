[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumilab-api"
version = "0.1.0"
description = "LumiLab API foundation; business modules are implemented incrementally"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136,<0.137", "pydantic>=2.13,<3", "pydantic-settings>=2.10,<3",
  "uvicorn>=0.52,<0.53", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5", "httpx>=0.28,<0.29"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29", "ruff>=0.14,<1", "playwright==1.64.1"]
science = ["pint>=0.25,<1", "sympy>=1.14,<2"]
ai = ["google-genai>=1,<3"]
rag = ["sentence-transformers>=5,<6", "chromadb>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
