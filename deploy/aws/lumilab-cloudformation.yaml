AWSTemplateFormatVersion: '2010-09-09'
Description: 'LumiLab All-in-One AWS Stack: RDS PostgreSQL (db.t3.micro), EC2 Backend API (t3.micro), S3 Web Bucket, and CloudFront Distribution.'

Parameters:
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 32
    Default: 'LumiLab_2026_Secure!'
    Description: Password for the PostgreSQL 'lumilab' user (min 8 chars).

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: Automatically resolves latest Ubuntu 24.04 AMI in the current region.

Resources:
  # 1. VPC & Networking
  LumiLabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: lumilab-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: lumilab-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LumiLabVPC
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LumiLabVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lumilab-subnet-a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LumiLabVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: lumilab-subnet-b

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LumiLabVPC
      Tags:
        - Key: Name
          Value: lumilab-public-routes

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # 2. Security Groups
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for LumiLab API EC2
      VpcId: !Ref LumiLabVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: Allow API traffic for CloudFront
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Allow SSH
      Tags:
        - Key: Name
          Value: lumilab-ec2-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for LumiLab RDS PostgreSQL
      VpcId: !Ref LumiLabVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: Allow PostgreSQL from EC2 only
      Tags:
        - Key: Name
          Value: lumilab-rds-sg

  # 3. RDS PostgreSQL (Free Tier)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for LumiLab RDS
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  PostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "lumilab-db-${AWS::StackName}"
      Engine: postgres
      EngineVersion: '15'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: lumilab
      MasterUsername: lumilab
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: lumilab-db

  # 4. EC2 Instance for API
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PostgresDB
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetA
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 25
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/lumilab-deploy.log 2>&1
          set -e

          # Setup 2GB Swap
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # Install Docker & Git
          apt-get update
          apt-get install -y docker.io git curl
          systemctl enable --now docker

          # Clone repository
          cd /opt
          git clone https://github.com/PhucTruong11/Lumilab-All_In_One.git
          cd Lumilab-All_In_One

          # Write runtime .env
          cat << 'ENVEOF' > .env
          LUMILAB_ENV=production
          LUMILAB_DATABASE_URL=postgresql+psycopg://lumilab:${DBPassword}@${PostgresDB.Endpoint.Address}:5432/lumilab?sslmode=require
          LUMILAB_LLM_ENABLED=false
          LUMILAB_LLM_EVENT_CAP=0
          LUMILAB_LLM_SESSION_DAILY=30
          LUMILAB_ALLOWED_ORIGINS=["*"]
          ENVEOF

          # Build image, run migration, and launch API
          docker build -f docker/api.Dockerfile -t lumilab-api .
          docker run --rm --env-file .env lumilab-api python -m lumilab_api.run_schema
          docker run -d --name lumilab-api --restart always --env-file .env -p 8000:8000 lumilab-api
      Tags:
        - Key: Name
          Value: lumilab-api

  # 6. S3 Bucket for Web Static
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: lumilab-web

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "oac-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # 7. CloudFront Distribution (Web + /api/* proxy to EC2)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: LumiLab All-in-One CloudFront CDN
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: S3WebOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: EC2ApiOrigin
            DomainName: !GetAtt EC2Instance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 8000
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: EC2ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Authorization
                - Content-Type
                - Accept
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  CloudFrontURL:
    Description: Website HTTPS URL (LumiLab Web + API)
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  S3BucketName:
    Description: S3 Bucket Name to upload web dist
    Value: !Ref WebBucket
  EC2PublicIP:
    Description: Public IP of the API EC2 instance
    Value: !GetAtt EC2Instance.PublicIp
  RDSAddress:
    Description: RDS PostgreSQL Endpoint Address
    Value: !GetAtt PostgresDB.Endpoint.Address

