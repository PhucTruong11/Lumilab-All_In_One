name: quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:web
      - run: npm run test:unit
      - run: npm run build:web
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r docker/requirements-dev.lock
      - run: python -m pip install --no-deps -e apps/api
      - run: python -m ruff check apps/api
      - run: python -m lumilab_api.data_cli lint --include-drafts
      - run: python -m lumilab_api.data_cli build --include-drafts
      - run: python -m pytest apps/api/tests
      - run: python scripts/export_api_schemas.py --check
      - run: python scripts/check_foundation.py
      - run: python scripts/check_docs.py
  e2e:
    runs-on: ubuntu-latest
    env:
      LUMILAB_DATABASE_URL: postgresql+psycopg://lumilab:lumilab_test@127.0.0.1:5432/lumilab
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lumilab
          POSTGRES_USER: lumilab
          POSTGRES_PASSWORD: lumilab_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U lumilab" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r docker/requirements-dev.lock
      - run: python -m pip install --no-deps -e apps/api
      - run: npx playwright install --with-deps chromium
      - run: python -m lumilab_api.run_schema
      - run: python -m lumilab_api.data_cli build --include-drafts
      - run: python -m pytest apps/api/tests/test_tutor_postgres.py apps/api/tests/test_tutor_run_acceptance_pg.py -q
      - run: npm run test:e2e

  docker:
    needs: [frontend, backend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test final images through Nginx and retain rollback bundle
        run: python scripts/docker_release.py build-test --project "lumilab-ci-${{ github.run_id }}-${{ github.run_attempt }}" --output .local/docker-release
      - name: Retain tested image archive, digests and version manifest
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/docker-release/images.tar.gz
            .local/docker-release/release.json
            .local/docker-release/smoke.json
            .local/docker-release/rollback.yml
      - name: Retain isolated stack diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore
          path: .local/docker-release/compose.log

  quality-gate:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [frontend, backend, e2e, docker]
    steps:
      - name: Require all checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          printf 'Frontend: %s\nBackend: %s\nE2E: %s\nDocker: %s\n' "$FRONTEND" "$BACKEND" "$E2E" "$DOCKER"
          test "$FRONTEND" = success && test "$BACKEND" = success && test "$E2E" = success && test "$DOCKER" = success
