name: lumilab-b-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumilab}
      POSTGRES_USER: ${POSTGRES_USER:-lumilab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumilab_local_only}
    ports: ["127.0.0.1:${LUMILAB_DB_PORT:-15434}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      LUMILAB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lumilab}:${POSTGRES_PASSWORD:-lumilab_local_only}@db:5432/${POSTGRES_DB:-lumilab}
      LUMILAB_LLM_ENABLED: "false"
      LUMILAB_LLM_EVENT_CAP: "0"
      LUMILAB_RAG_ENABLED: "false"
    ports: ["127.0.0.1:${LUMILAB_API_PORT:-8002}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
  chroma:
    image: chromadb/chroma:1.3.0
    profiles: ["rag"]
    ports: ["127.0.0.1:8003:8000"]
    volumes: ["chroma_data:/data"]
volumes:
  postgres_data:
  chroma_data:
